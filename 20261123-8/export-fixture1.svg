<svg xmlns="http://www.w3.org/2000/svg" width="288" height="744" viewBox="0 0 288 744" role="img"><title>Synthetic makerspace card batch</title><rect width="100%" height="100%" fill="#f5f3ec"/><g><rect x="16" y="24" width="256" height="216" rx="8" fill="#ffffff" stroke="#183f39"/><text x="24" y="48" font-size="12" fill="#45645e">bench-1 / recycle</text><text x="24" y="78" font-family="monospace" font-size="16" fill="#17332f" textLength="140" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Please flatten</text><text x="24" y="102" font-family="monospace" font-size="16" fill="#17332f" textLength="220" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cardboard boxes before</text><text x="24" y="126" font-family="monospace" font-size="16" fill="#17332f" textLength="190" lengthAdjust="spacingAndGlyphs" xml:space="preserve">placing them in the</text><text x="24" y="150" font-family="monospace" font-size="16" fill="#17332f" textLength="200" lengthAdjust="spacingAndGlyphs" xml:space="preserve">paper recycling bin.</text></g><g><rect x="16" y="264" width="256" height="216" rx="8" fill="#ffffff" stroke="#183f39"/><text x="24" y="288" font-size="12" fill="#45645e">bench-2 / tools</text><text x="24" y="318" font-family="monospace" font-size="16" fill="#17332f" textLength="190" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Borrow tools at the</text><text x="24" y="342" font-family="monospace" font-size="16" fill="#17332f" textLength="200" lengthAdjust="spacingAndGlyphs" xml:space="preserve">counter. Return each</text><text x="24" y="366" font-family="monospace" font-size="16" fill="#17332f" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">tool to its marked</text><text x="24" y="390" font-family="monospace" font-size="16" fill="#17332f" textLength="200" lengthAdjust="spacingAndGlyphs" xml:space="preserve">place when finished.</text></g><g><rect x="16" y="504" width="256" height="216" rx="8" fill="#ffffff" stroke="#183f39"/><text x="24" y="528" font-size="12" fill="#45645e">bench-3 / recycle</text><text x="24" y="558" font-family="monospace" font-size="16" fill="#17332f" textLength="220" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Sort paper and plastic</text><text x="24" y="582" font-family="monospace" font-size="16" fill="#17332f" textLength="150" lengthAdjust="spacingAndGlyphs" xml:space="preserve">into the marked</text><text x="24" y="606" font-family="monospace" font-size="16" fill="#17332f" textLength="210" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bins. Keep food waste</text><text x="24" y="630" font-family="monospace" font-size="16" fill="#17332f" textLength="170" lengthAdjust="spacingAndGlyphs" xml:space="preserve">out of recycling.</text></g></svg>