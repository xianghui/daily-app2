<svg xmlns="http://www.w3.org/2000/svg" width="298" height="480" viewBox="0 0 298 480" role="img"><title>Synthetic library desk cards</title><rect width="100%" height="100%" fill="#f5f3ec"/><g><rect x="16" y="24" width="266" height="192" rx="8" fill="#ffffff" stroke="#183f39"/><text x="24" y="48" font-size="12" fill="#45645e">desk-2 / quiet</text><text x="24" y="78" font-family="monospace" font-size="16" fill="#17332f" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Quiet study space.</text><text x="24" y="102" font-family="monospace" font-size="16" fill="#17332f" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Silence your phone</text><text x="24" y="126" font-family="monospace" font-size="16" fill="#17332f" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">and use headphones</text><text x="24" y="150" font-family="monospace" font-size="16" fill="#17332f" textLength="160" lengthAdjust="spacingAndGlyphs" xml:space="preserve">at a low volume.</text></g><g><rect x="16" y="240" width="266" height="216" rx="8" fill="#ffffff" stroke="#183f39"/><text x="24" y="264" font-size="12" fill="#45645e">desk-3 / arrival</text><text x="24" y="294" font-family="monospace" font-size="16" fill="#17332f" textLength="190" lengthAdjust="spacingAndGlyphs" xml:space="preserve">New visitors please</text><text x="24" y="318" font-family="monospace" font-size="16" fill="#17332f" textLength="140" lengthAdjust="spacingAndGlyphs" xml:space="preserve">check in here.</text><text x="24" y="342" font-family="monospace" font-size="16" fill="#17332f" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Our team will help</text><text x="24" y="366" font-family="monospace" font-size="16" fill="#17332f" textLength="160" lengthAdjust="spacingAndGlyphs" xml:space="preserve">you get started.</text></g></svg>