<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Synthetic workshop annotation overlay</title><desc>Reviewed callout overlay. Coordinates in pixels. Background artwork not included. Leader crossings are not optimized.</desc><rect width="100%" height="100%" fill="#faf7fc"/><circle cx="130" cy="160" r="5" fill="#74548f"><title>WATER: Water supply pipe inlet valve for filling the machine cooling tank</title></circle><circle cx="240" cy="185" r="5" fill="#74548f"><title>MOTOR: Electric motor drive spindle rotating shaft that powers the machine</title></circle><circle cx="340" cy="210" r="5" fill="#74548f"><title>FILTER: Air filter dust extraction vent cleans airborne particles</title></circle><circle cx="180" cy="235" r="5" fill="#74548f"><title>SCREEN: Digital display touchscreen control panel operator settings</title></circle><g data-record="C1"><title>Cooling water inlet</title><line x1="130" y1="160" x2="620" y2="132.4" stroke="#9e80b7"/><rect x="620" y="114.4" width="260" height="36" rx="8" fill="#ede2f5" stroke="#b49cc7"/><text font-family="monospace" font-size="14" fill="#34243e" xml:space="preserve"><tspan x="632" y="137.4">Cooling water inlet</tspan></text></g><g data-record="C2"><title>Drive motor and spindle</title><line x1="240" y1="185" x2="620" y2="180.4" stroke="#9e80b7"/><rect x="620" y="162.4" width="260" height="36" rx="8" fill="#ede2f5" stroke="#b49cc7"/><text font-family="monospace" font-size="14" fill="#34243e" xml:space="preserve"><tspan x="632" y="185.4">Drive motor and spindle</tspan></text></g><g data-record="C3"><title>Dust extraction filter</title><line x1="340" y1="210" x2="620" y2="228.4" stroke="#9e80b7"/><rect x="620" y="210.4" width="260" height="36" rx="8" fill="#ede2f5" stroke="#b49cc7"/><text font-family="monospace" font-size="14" fill="#34243e" xml:space="preserve"><tspan x="632" y="233.4">Dust extraction filter</tspan></text></g><g data-record="C4"><title>Operator touch display</title><line x1="180" y1="235" x2="620" y2="276.4" stroke="#9e80b7"/><rect x="620" y="258.4" width="260" height="36" rx="8" fill="#ede2f5" stroke="#b49cc7"/><text font-family="monospace" font-size="14" fill="#34243e" xml:space="preserve"><tspan x="632" y="281.4">Operator touch display</tspan></text></g></svg>