<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily App Collection 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');
  :root {
    --bg:#0a0e17;--surface:#111827;--surface2:#1a2236;--border:#1e2d4a;
    --text:#e8edf5;--text-dim:#7a8ba8;--accent:#6c5ce7;--accent-glow:rgba(108,92,231,0.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12;animation:orbFloat 20s ease-in-out infinite;}
  .bg-orbs .orb:nth-child(1){width:500px;height:500px;background:var(--accent);top:-10%;left:-10%;}
  .bg-orbs .orb:nth-child(2){width:400px;height:400px;background:#00b894;bottom:-10%;right:-10%;animation-delay:-7s;}
  .bg-orbs .orb:nth-child(3){width:300px;height:300px;background:#fdcb6e;top:50%;left:50%;animation-delay:-14s;}
  @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.9)}}
  .app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 24px;}
  .header{text-align:center;margin-bottom:32px;}
  .header h1{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#fdcb6e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
  .header .tagline{color:var(--text-dim);font-size:1rem;font-weight:300;letter-spacing:1px;}
  .header .stats{display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  .header .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px;text-align:center;min-width:90px;}
  .header .stat-val{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),#00b894);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header .stat-label{font-size:.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .controls{display:flex;justify-content:center;margin:24px 0 28px;}
  .search{width:min(680px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:.95rem;outline:none;}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);}
  .sections{display:flex;flex-direction:column;gap:36px;}
  .section{display:flex;flex-direction:column;gap:16px;}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;}
  .section-title{font-family:'Playfair Display',serif;font-size:1.6rem;}
  .section-meta{color:var(--text-dim);font-size:.85rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;text-decoration:none;color:var(--text);transition:all .25s;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .card:hover{border-color:var(--accent);box-shadow:0 0 30px var(--accent-glow);transform:translateY(-4px);}
  .card .badge{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);}
  .card .date{color:var(--text-dim);font-size:.75rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .card h2{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;margin-bottom:8px;line-height:1.3;padding-right:72px;}
  .card .desc{color:var(--text-dim);font-size:.85rem;line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .card .arrow{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--accent);font-size:.85rem;font-weight:600;transition:gap .2s;}
  .card:hover .arrow{gap:10px;}
  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);grid-column:1/-1;}
  @media(max-width:640px){.header h1{font-size:2rem;}.grid{grid-template-columns:1fr;}.app{padding:28px 16px;}}
</style>
</head>

<script>
const BASE_URL='https://xianghui.github.io/daily-app2/';
const APPS=[
  {folder:"20261030-25",name:"Press & Pleat",area:"stl",desc:"Snip sixteen runners, bond two shouldered guides and lower a lift-off complementary wave die to gently crimp narrow paper strips against four real closing stops. Customize measured sheet/socket fits, wave pitch and gap; local PNG/JPEG/SVG or verified ASCII/binary STL signature engravings, connected-card, clean-part STL and ZIP. Adhesive required; physical paper forming and printing untested."},
  {folder:"20261030-24",name:"Dot & Dimple",area:"stl",desc:"Snip sixteen runners and register a perforated guide over matched blind wells using two removable T keys for a paper dot-embossing slate. Customize measured sheet/slot fits, dot cells and well depths; local PNG/JPEG/SVG or verified ASCII/binary STL backing engravings, connected-card and four-part STL/ZIP. Paper and round stylus required; forming/legibility untested, not certified Braille."},
  {folder:"20261030-23",name:"Breeze & Bearing",area:"stl",desc:"Snip twenty runners and assemble a compass deck, shouldered mast, free-turn arrow, upright aft tail and bonded keeper for a five-part weather-vane teaching kit. Customize measured sheet/socket fits, journal play and local PNG/JPEG/SVG or verified ASCII/binary STL deck engravings; connected-card, clean-part STL and assembly ZIP. Adhesive required; physical printing and wind response untested."},
  {folder:"20261030-22",name:"Quarter & Weft",area:"stl",desc:"Snip 20 runners, seat two four-eyed anchors and thread a free quarter-turn tablet to weave a short four-strand band with a separate shuttle. Customize measured sheet/socket fits, tablet eyes and local PNG/JPEG/SVG or verified ASCII/binary STL deck engravings; connected-card, five clean-part STLs and assembly ZIP. Soft cord, weft and adhesive required; physical printing and weaving untested."},
  {folder:"20261030-21",name:"Lens & Focus",area:"stl",desc:"Snip 20 runners, bond a lens-tower ring stack and lift a paper screen among six indexed positions for a five-part optical bench. Customize measured sheet/socket fits, lens pocket and local PNG/JPEG/SVG or verified ASCII/binary STL engravings; connected-card, clean-part STL and assembly ZIP. Purchased acrylic lens, paper, tape and adhesive required; physical focus and printing untested."},
  {folder:"20261030-20",name:"Cam & Cradle",area:"stl",desc:"Snip 24 runners, seat two arched cheeks and bond a keeper around a free eccentric cam for a six-part paper-holder kit. Customize nip range, lever and reference-derived sheet fits; local PNG/JPEG/SVG relief and verified ASCII/binary STL deck marks, connected-card, clean-part STL and ZIP. Adhesive required; physical holding force and self-locking untested."},
  {folder:"20261030-19",name:"Score & Square",area:"stl",desc:"Snip twelve runners and seat paired sheet walls in four calibrated deck sockets for a miniature scoring alignment guide. Customize square/mitre planes, work channel and reference-derived fits; local PNG/JPEG/SVG relief and verified ASCII/binary STL deck engravings, real connected-card, clean-part STL and ZIP. Adhesive, scoring tool and sacrificial spacer required; physical scoring/accuracy untested."},
  {folder:"20261030-18",name:"Sweep & Scribe",area:"stl",desc:"Snip twelve runners, bond a shouldered pivot in its foot and lower a lift-off compass beam to guide pencil circles. Customize reference-derived sheet fits, radius, bearing height and pencil bore; local PNG/JPEG/SVG relief and verified ASCII/binary STL beam engravings, connected-card and clean-part STL/ZIP. Pencil and adhesive required; physical print and drawing accuracy untested."},
  {folder:"20261030-17",name:"Loop & Land",area:"stl",desc:"Snip twelve runners, seat a calibrated catch blade in a personalized paddle and tether a pierced ring for gentle ring-over-tip dexterity. Customize source-derived sheet fits, ring bore, blade height and cord eyes; local PNG/JPEG/SVG relief and verified ASCII/binary STL paddle engravings, connected-card and clean-part STL/ZIP. Soft cord and adhesive required; no physical catch test."},
  {folder:"20261030-16",name:"Prism & Repeat",area:"stl",desc:"Snip twenty runners, line three walls with flexible mirror film and seat twelve calibrated tongues in two triangular frames for a five-part viewing tunnel. Customize reference-derived sheet fits, triangle span and tube length; local PNG/JPEG/SVG relief and verified ASCII/binary STL wall engravings, connected-card and clean-part STL/ZIP. Film and adhesive required; no physical or optical test."},
  {folder:"20261030-15",name:"Roll & Reveal",area:"stl",desc:"Snip 28 runners and assemble a seven-part paper-scroll stage with two independently hand-wound headed spindles and bonded keepers. Customize paper span, round-bearing clearance and reference-derived sheet sockets; local PNG/JPEG/SVG relief and verified ASCII/binary STL cheek engravings, connected-card and clean-part STL/ZIP. Paper, tape and adhesive required; no physical winding test."},
  {folder:"20261030-14",name:"Rise & Reflect",area:"stl",desc:"Snip sixteen runners and seat two opposing 45-degree mirror shelves between calibrated windowed cheeks for a four-part open-frame periscope. Customize viewing rise, span and reference-derived angled joints; local PNG/JPEG/SVG relief and verified ASCII/binary STL frame marks, connected-card and clean-part STL/ZIP. Mirror film and adhesive required; no physical optical test."},
  {folder:"20261030-13",name:"Loop & Horn",area:"stl",desc:"Snip twelve runners, seat a source-fit two-horn fork in its palm handle, and braid square cord by lifting alternate figure-eight yarn loops. Customize horns, eye and calibrated socket; local PNG/JPEG/SVG or ASCII/binary STL palm engravings, connected-card and clean-part STL/ZIP. Yarn and adhesive required; no physical print test."},
  {folder:"20261030-12",name:"Flip & Cascade",area:"stl",desc:"Snip twenty runners to release four dual-grooved tiles and a source-fit threading shuttle, then alternate three soft ribbons for a Jacob’s-ladder flip ritual. Customize tile proportions, calibrated slots and recessed local PNG/JPEG/SVG or ASCII/binary STL art; real connected-card, clean-part STL and assembly ZIP. Ribbon and adhesive required; no physical cascade test."},
  {folder:"20261030-11",name:"Sector & Span",area:"stl",desc:"Snip sixteen runners, bond a shouldered axle and transverse keeper, then fan two four-station arms to explore 1:2:3:4 similar-triangle spans. Customize real reach, station pitch and reference-derived calibrated fits; local PNG/JPEG/SVG relief and verified ASCII/binary STL tip marks, connected-card, per-part STLs and assembly ZIP. Adhesive at fixed joints; no precision accuracy or physical print test."},
  {folder:"20261030-10",name:"Meridian & Orbit",area:"stl",desc:"Snip sixteen runners and side-insert two half-hoops into shared polar sockets, then seat the full meridian on a marked pedestal for a four-part great-circle sculpture. Customize real hoop radii, band walls and reference-derived calibrated fits; local PNG/JPEG/SVG relief and verified ASCII/binary STL marks, connected-card, clean-part STLs and assembly ZIP. Adhesive required; static, not an astronomical instrument; no physical print test."},
  {folder:"20261030-9",name:"Cradle & Stitch",area:"stl",desc:"Snip sixteen runners and slide two inclined-slot saddles onto paired wings for a four-part miniature bookbinding cradle. Customize V opening, open stitching channel and reference-derived calibrated tongue fits; local PNG/JPEG/SVG underside relief and verified ASCII/binary STL marks, connected-card, clean-part STLs and assembly ZIP. Adhesive required; no physical print or binding test."},
  {folder:"20261030-8",name:"Spire & String",area:"stl",desc:"Snip sixteen runners, cross-lap two uprights and seat eight deck tongues to build a ruled-string tower. Customize indexed cord eyes, lacing offset and calibrated reference-derived sheet joints; local PNG/JPEG/SVG relief and verified ASCII/binary STL lower-deck marks, real connected-card, clean-part STLs and assembly ZIP. Soft cord and adhesive required; no physical print test."},
  {folder:"20261030-7",name:"Fuse & Focus",area:"stl",desc:"Snip sixteen runners and seat two aperture/target panels plus an opaque septum in six calibrated deck sockets for a four-part lens-free stereo viewing kit. Customize eye spacing, target disparity and distance; measured sheet/socket reference, local PNG/JPEG/SVG relief and verified ASCII/binary STL deck marks, connected-card, part STLs and assembly ZIP. Adhesive required; no physical optical test."},
  {folder:"20261030-6",name:"Slit & Flicker",area:"stl",desc:"Snip twenty runners, seat a calibrated tower and bond a fixed axle and keeper around a free radial-slit optical wheel. Customize frame count, engraved dot phases, fits and foot silhouettes; measured sheet/socket reference, local PNG/JPEG/SVG relief and verified ASCII/binary STL tower marks, connected-card, five part STLs and assembly ZIP. Mirror and adhesive required; physical optical effect untested."},
  {folder:"20261030-5",name:"Wave & Phase",area:"stl",desc:"Snip 32 runners, bond two calibrated feet and hang five paired-cord bobs for a calculated drifting pendulum wave. Measured sheet/socket reference, adjustable effective lengths and local PNG/JPEG/SVG relief or verified ASCII/binary STL header marks; connected-card, eight part STLs and ZIP with length table. Cord and adhesive required; physical timing untested."},
  {folder:"20261030-4",name:"Spin & Skein",area:"stl",desc:"Snip twelve runners and cross two whorl arms on a gravity-seated shaft for a knock-down yarn spindle. Measured sheet/socket reference, calibrated indexing and local PNG/JPEG/SVG relief or verified ASCII/binary STL shaft marks; connected-card, clean-part STL and assembly ZIP. Yarn required; slow finger-spin only, no positive retention or physical print test."},
  {folder:"20261030-3",name:"Comb & Curl",area:"stl",desc:"Snip twelve runners and seat a blunt-tined spine in two calibrated feet for a standing paper-quilling comb kit. Adjust tine pitch, count, height and foot silhouettes; measured sheet/socket reference, local PNG/JPEG/SVG relief and verified ASCII/binary STL badges, connected-card and clean-part STL/ZIP. Paper and adhesive required; physical strength and release untested."},
  {folder:"20261030-2",name:"Trace & Tally",area:"stl",desc:"Snip sixteen runners, seat a flat axle and side-insert a keeper to build a four-part rolling-distance kit. Customize a graduated wheel, handle and calibrated bearing; local PNG/JPEG/SVG relief or verified ASCII/binary STL handle marks, connected-card and per-part STL/ZIP. Fixed joints need adhesive; calibrate against a known path, not a precision instrument."},
  {folder:"20261030-1",name:"Shed & Seat",area:"stl",desc:"Snip eight runners and seat a pierced reed in a calibrated socket handle. Alternate warp yarn through long slots and round eyes, then lift the heddle in an external loom setup. Measured sheet/socket reference, adjustable thread paths, local PNG/JPEG/SVG relief and verified ASCII/binary STL marks; connected-card, part STL and assembly ZIP. External warp, shuttle and adhesive required; weaving physically untested."},
  {folder:"20261029-33",name:"Skein & Cross",area:"stl",desc:"Snip eight runners, seat a T spine in a perpendicular crossarm and loosely wind four open tips to gather a miniature yarn hank. Measured sheet/socket reference, calibrated tongue fit and ergonomic grips; local PNG/JPEG/SVG relief and verified ASCII/binary STL grips, connected-card, two-part STL and assembly ZIP. Yarn, ties and adhesive required; physical winding and release untested."},
  {folder:"20261029-32",name:"Loop & Crown",area:"stl",desc:"Snip 28 runners, seat four forked pegs and two arched feet on an open-center deck for a seven-part knitting-loom kit card. Measured sheet/socket reference, calibrated joints, local PNG/JPEG/SVG relief and verified ASCII/binary STL grip marks; connected-card, clean-part STLs and assembly ZIP. Yarn, blunt hook and adhesive required; physical knitting untested."},
  {folder:"20261029-31",name:"Tumble & Tray",area:"stl",desc:"Snip 28 runners, seat two alternating inclined baffles between pierced cheeks and lower into a tray for a seven-panel miniature gravity tower. Measured sheet/socket reference, calibrated fits, local PNG/JPEG/SVG relief and verified ASCII/binary STL grips; connected-card, per-part STL and ZIP. Adhesive and external 6 mm bead/die required; flow physically untested."},
  {folder:"20261029-30",name:"Scoop & Sweep",area:"stl",desc:"Snip sixteen runners and seat two rising cheeks plus a rear wall in six calibrated floor joints for a four-panel miniature desk scoop. Measured sheet/socket reference, customizable floor and lip, local PNG/JPEG/SVG relief and verified ASCII/binary STL handle grips; connected-card and per-part STL/ZIP. Adhesive required; dry scraps only, not food-safe or watertight."},
  {folder:"20261029-29",name:"Caliper & Slide",area:"stl",desc:"Snip twelve runners, flip a tongue-bearing jaw and bond its underside keeper for a captive vernier teaching gauge. Measured sheet/socket reference, adjustable pitch, reach and calibrated gaps; local PNG/JPEG/SVG relief and verified ASCII/binary STL wing grips, connected-card and three-part STL/ZIP. Adhesive required; educational, not a calibrated instrument."},
  {folder:"20261029-28",name:"Glow & Gather",area:"stl",desc:"Snip 24 runners, seat four pierced screens and lower a vented lid for a six-part LED-only lantern. Measured sheet/socket reference, customizable windows and calibrated tongues; local PNG/JPEG/SVG relief and verified ASCII/binary STL wing grips, connected-card and per-part STL/ZIP. Bottom-seat adhesive required; optional battery LED, never flame."},
  {folder:"20261029-27",name:"Slide & Poise",area:"stl",desc:"Snip twenty runners, glue a calibrated mast and suspend an asymmetric beam, printed load and sliding cord-hung poise for a steelyard moment ritual. Measured sheet/socket reference, actual-mesh balance calculation, local PNG/JPEG/SVG relief and verified ASCII/binary STL plinth marks; connected-card, five-part STL and assembly ZIP. Thread and adhesive required; not a calibrated scale."},
  {folder:"20261029-26",name:"Tip & Cascade",area:"stl",desc:"Snip forty runners, glue two calibrated keyed runway halves and stand eight crown-shaped tiles for a gentle chain reaction. Measured sheet/carrier reference, adjustable tile height and station pitch; local PNG/JPEG/SVG relief and verified ASCII/binary STL runway marks, connected-card and per-part STL/ZIP export. Adhesive required; cascade not physically tested."},
  {folder:"20261029-25",name:"Braid & Gather",area:"stl",desc:"Snip twenty runners, seat three radial legs between an indexed top and open foot, then arrange soft cords among eight loose braiding guides. Measured pierced-sheet/socket reference, adjustable passage and calibrated fits; local PNG/JPEG/SVG relief and verified ASCII/binary STL top grips, connected-card and five-part STL/ZIP. Cord and six-socket adhesive required; no cord-clamping claim."},
  {folder:"20261029-24",name:"Stack & Transfer",area:"stl",desc:"Snip 32 runners, glue three shouldered posts into a calibrated base and lift four annular rings for a 15-move transfer ritual. Measured sheet/carrier reference, customizable ring sizes and fits, local PNG/JPEG/SVG relief and verified ASCII/binary STL base grips; connected-card, eight part STLs and assembly ZIP. Adhesive required; rings intentionally lift out."},
  {folder:"20261029-23",name:"Hang & Trace",area:"stl",desc:"Snip twelve runners, cross-lap a curve board onto two feet and drape a cord against a calculated engraved catenary. Measured sheet/carrier reference, adjustable eye span, sag and calibrated joints; local PNG/JPEG/SVG relief and verified ASCII/binary STL grips, connected-card and per-part STL/ZIP. Cord and adhesive required; ideal curve, no physical drape test."},
  {folder:"20261029-21",name:"Chord & Lattice",area:"stl",desc:"Snip twenty runners, seat three double-tenoned struts between two pierced crowns and lace indexed soft-thread chords into a hyperboloid sculpture. Measured sheet/carrier reference, adjustable eyes and calibrated joints, local PNG/JPEG/SVG relief and verified ASCII/binary STL labels; connected-card, five part STLs and assembly ZIP. Thread and adhesive required."},
  {folder:"20261029-20",name:"Corner & Return",area:"stl",desc:"Snip twelve runners and seat two perpendicular mirror panels in six calibrated floor joints for a trihedral reflection demonstrator. Measured sheet/carrier reference, adjustable mirror guides, local PNG/JPEG/SVG relief and verified ASCII/binary STL labels; connected-card, three part STLs and assembly ZIP. Mirror film and adhesive required; optical performance untested."},
  {folder:"20261029-19",name:"Cell & Slot",area:"stl",desc:"Snip 28 runners, seat two up-slotted rails and lower four down-slotted combs into a three-bay rack with eight cross-laps and fourteen floor tongues. Measured sheet/carrier reference, adjustable cells and calibrated fits, local PNG/JPEG/SVG relief and verified ASCII/binary STL label grips; connected-card, seven part STLs and assembly ZIP. Adhesive required."},
  {folder:"20261029-18",name:"Ray & Box",area:"stl",desc:"Snip 24 runners and seat six opaque panels into sixteen calibrated tongue joints for a pinhole projection chamber with a paper-screen window. Measured sheet/carrier reference, adjustable aperture and chamber, local PNG/JPEG/SVG relief and verified ASCII/binary STL label grips; connected-card, per-part STL and assembly ZIP. Paper, opaque tape and adhesive required; optical performance untested."},
  {folder:"20261029-17",name:"Shutter & Shimmer",area:"stl",desc:"Slowly turn mismatched N/N+1 radial screens to walk a wave of light through real apertures. Measured coaxial-sleeve reconstruction, calibrated plain bearing and bonded keeper; local PNG/JPEG/SVG relief and verified ASCII/binary STL palm grips, three bed-flat part STLs and assembly ZIP. Adhesive required for retention; horizontal lift-out alternative."},
  {folder:"20261029-16",name:"Thread & Span",area:"stl",desc:"Snip twenty runners, glue two portal towers into calibrated feet and tie four soft cords to suspend a personalized deck through their windows. Measured sheet/carrier reference, cord-clearance checked assembly, local PNG/JPEG/SVG relief and verified ASCII/binary STL medallions; connected-card, five part STLs and assembly ZIP. Cord and adhesive required; not load-bearing."},
  {folder:"20261029-15",name:"Tunnel & Sight",area:"stl",desc:"Snip twenty runners and seat four graded apertures in a marked eight-mortise plinth; look from a customizable eye point for aligned perspective rays and layered parallax. Measured sheet/carrier reference, calibrated seats, local PNG/JPEG/SVG relief and verified ASCII/binary STL grips; connected-card, part STL and assembly ZIP. Adhesive required; static optical sculpture."},
  {folder:"20261029-14",name:"Lace & Facet",area:"stl",desc:"Snip sixteen runners and lace four paired-eye triangular panels into a thickness-offset tetrahedron with six soft cords. Measured sheet/carrier reference, customizable seam gaps and eyes; local PNG/JPEG/SVG relief and verified ASCII/binary STL medallions, connected-card and per-part STL/ZIP export. Cord required; ideal tied pose, not a sealed box."},
  {folder:"20261029-13",name:"Tangram & Tuck",area:"stl",desc:"Snip 36 tabs, bond a finger-access rim to its backing and rearrange seven inward-offset tangram tiles in a calibrated square well. Measured sheet/carrier reference, customizable tray and gaps, local PNG/JPEG/SVG relief and verified ASCII/binary STL grips; connected-card, nine part STLs and assembly ZIP. Rim adhesive required; tiles remain loose."},
{folder:"20261029-12",name:"Sweep & Soar",area:"stl",desc:"Snip 24 runners, side-thread a swept wing and tailplane through fuselage mortises, then seat the six-part display aircraft in twin open-notch cradles. Measured sheet/carrier reference, customizable foil envelopes and calibrated joints; local PNG/JPEG/SVG relief and verified ASCII/binary STL plinth grips, connected-card and individual STL/ZIP. Adhesive required; static model, not a flying glider."},
  {folder:"20261029-11",name:"Paddle & Turn",area:"stl",desc:"Snip 36 runners and assemble four shouldered paddles between two pierced cheeks, then thread a saddle-ended fixed axle through the wheel and glue it onto a seated U yoke. Measured sheet/carrier reference, calibrated bearings and joints, local PNG/JPEG/SVG relief and verified ASCII/binary STL foot grips; connected-card, part STL and assembly ZIP. Adhesive required; dry desk miniature."},
  {folder:"20261029-10",name:"Nudge & Echo",area:"stl",desc:"Snip 24 runners, glue a tongue-seated portal into two feet and tie six paired cords to three rim-contact bobs for gentle collision-pendulum releases. Measured sheet/carrier reference, bounded release geometry, local PNG/JPEG/SVG relief and verified ASCII/binary STL grips; connected-card, part STL and assembly ZIP. Cord and adhesive required; no ideal energy-transfer claim."},

const d=document;
const sections=d.getElementById('sections');
const search=d.getElementById('search');

const areaOrder=['stl','game','saas'];
const areaLabels={stl:'STL Generators',game:'Mini Games',saas:'SaaS Apps'};

d.getElementById('total-apps').textContent=APPS.length;
d.getElementById('total-saas').textContent=APPS.filter(a=>a.area==='saas').length;
d.getElementById('total-game').textContent=APPS.filter(a=>a.area==='game').length;

function makeCard(app) {
  const card=d.createElement('a');
  card.className='card';
  card.href=`${BASE_URL}${app.folder}/index.html`;
  card.target='_blank';
  card.rel='noopener';
  card.innerHTML=`
    <div class="badge">${app.area}</div>
    <div class="date">${app.folder}</div>
    <h2>${app.name}</h2>
    <div class="desc">${app.desc}</div>
    <div class="arrow">Open app →</div>
  `;
  return card;
}

function renderApps() {
  const q=(search.value||'').trim().toLowerCase();
  const filtered=APPS.filter(app => !q || [app.folder, app.name, app.desc, app.area].join(' ').toLowerCase().includes(q));
  sections.innerHTML='';
  if (!filtered.length) {
    sections.innerHTML='<div class="empty">No apps match your search.</div>';
    return;
  }

  const grouped=new Map();
  filtered.forEach(app=>{
    const key=areaOrder.includes(app.area) ? app.area : 'other';
    if(!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(app);
  });

  const orderedKeys=[...areaOrder.filter(k=>grouped.has(k)), ...[...grouped.keys()].filter(k=>!areaOrder.includes(k))];
  orderedKeys.forEach(key=>{
    const list=grouped.get(key);
    const section=d.createElement('section');
    section.className='section';

    const head=d.createElement('div');
    head.className='section-head';
    head.innerHTML=`<div class="section-title">${areaLabels[key] || key.charAt(0).toUpperCase()+key.slice(1)}</div><div class="section-meta">${list.length} item${list.length===1?'':'s'}</div>`;

    const grid=d.createElement('div');
    grid.className='grid';
    list.forEach(app=>grid.appendChild(makeCard(app)));

    section.appendChild(head);
    section.appendChild(grid);
    sections.appendChild(section);
  });
}

search.addEventListener('input', renderApps);
renderApps();
