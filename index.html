<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily App Collection 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');
  :root {
    --bg:#0a0e17;--surface:#111827;--surface2:#1a2236;--border:#1e2d4a;
    --text:#e8edf5;--text-dim:#7a8ba8;--accent:#6c5ce7;--accent-glow:rgba(108,92,231,0.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12;animation:orbFloat 20s ease-in-out infinite;}
  .bg-orbs .orb:nth-child(1){width:500px;height:500px;background:var(--accent);top:-10%;left:-10%;}
  .bg-orbs .orb:nth-child(2){width:400px;height:400px;background:#00b894;bottom:-10%;right:-10%;animation-delay:-7s;}
  .bg-orbs .orb:nth-child(3){width:300px;height:300px;background:#fdcb6e;top:50%;left:50%;animation-delay:-14s;}
  @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.9)}}
  .app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 24px;}
  .header{text-align:center;margin-bottom:32px;}
  .header h1{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#fdcb6e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
  .header .tagline{color:var(--text-dim);font-size:1rem;font-weight:300;letter-spacing:1px;}
  .header .stats{display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  .header .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px;text-align:center;min-width:90px;}
  .header .stat-val{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),#00b894);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header .stat-label{font-size:.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .controls{display:flex;justify-content:center;margin:24px 0 28px;}
  .search{width:min(680px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:.95rem;outline:none;}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);}
  .sections{display:flex;flex-direction:column;gap:36px;}
  .section{display:flex;flex-direction:column;gap:16px;}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;}
  .section-title{font-family:'Playfair Display',serif;font-size:1.6rem;}
  .section-meta{color:var(--text-dim);font-size:.85rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;text-decoration:none;color:var(--text);transition:all .25s;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .card:hover{border-color:var(--accent);box-shadow:0 0 30px var(--accent-glow);transform:translateY(-4px);}
  .card .badge{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);}
  .card .date{color:var(--text-dim);font-size:.75rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .card h2{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;margin-bottom:8px;line-height:1.3;padding-right:72px;}
  .card .desc{color:var(--text-dim);font-size:.85rem;line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .card .arrow{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--accent);font-size:.85rem;font-weight:600;transition:gap .2s;}
  .card:hover .arrow{gap:10px;}
  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);grid-column:1/-1;}
  @media(max-width:640px){.header h1{font-size:2rem;}.grid{grid-template-columns:1fr;}.app{padding:28px 16px;}}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="app">
  <div class="header">
    <h1>Daily App Lab 2</h1>
    <div class="tagline">Customizable 3D-printable fidget STL generators, plus the original app collection</div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="total-apps">0</div><div class="stat-label">Apps</div></div>
      <div class="stat"><div class="stat-val" id="total-saas">0</div><div class="stat-label">SaaS</div></div>
      <div class="stat"><div class="stat-val" id="total-game">0</div><div class="stat-label">Games</div></div>
    </div>
  </div>
  <p style="text-align:center;margin:16px"><a style="color:var(--accent)" href="https://xianghui.github.io/daily-app/">Explore the original collection →</a></p>
  <div class="controls">
    <input id="search" class="search" type="text" placeholder="Search by app name, folder, or description" />
  </div>
  <div class="sections" id="sections"></div>
</div>
<script>
const BASE_URL='https://xianghui.github.io/daily-app2/';
const APPS=[
  {folder:"20261021-10",name:"Tangle Tide",area:"stl",desc:"Customize two flex-gate tumble loops that thread together and roll through your fingertips. Adjustable oval shape, flex section, tactile ripples and gate fit, with a live 3D preview, full-size material trial and local binary STL export."},
  {folder:"20261021-9",name:"Pendle",area:"stl",desc:"Customize a gravity-return eccentric pendulum fidget with an oval palm base, off-center bob and hardware-free retaining cap. Live 3D preview, calibrated fit coupon and local separate-part binary STL export."},
  {folder:"20261021-8",name:"Wanderform",area:"stl",desc:"Customize a sphericon fidget whose crossed cone halves create a weaving wobble-roll. Adjustable size, softened profile and recessed grip bands, with live 3D preview, trial model and whole or flat-half binary STL export."},
  {folder:"20261021-7",name:"Stillwater",area:"stl",desc:"Customize a thumb-rubbing worry stone with a concave dish, concentric tactile ripples and ergonomic palm shape. Live 3D preview, tactile coupon and support-free local binary STL export."},
  {folder:"20261021-6",name:"Fold Flow",area:"stl",desc:"Customize a one-piece concertina squeeze fidget with distributed return bends, scalloped end grips and adjustable flexure dimensions. Live 3D preview, flex coupon and local binary STL export."},
  {folder:"20261021-5",name:"Tick Tide",area:"stl",desc:"Customize a hardware-free thumb ratchet with a yielding tangent pawl, adjustable click rhythm and flexible spring dimensions. Live 3D preview, fit coupon and separate-part binary STL export."},
  {folder:"20261021-4",name:"Counterturn",area:"stl",desc:"Customize two coupled involute thumb gears on a scalloped palm base. Adjustable size, tooth count, running fit and hardware-free caps, with live 3D preview, calibration coupon and local binary STL export."},
  {folder:"20261021-3",name:"Link Drift",area:"stl",desc:"Customize a finger-walking articulated palm chain with rounded scalloped links, adjustable pivot clearance and hardware-free press-fit caps. Live 3D preview, fit coupon and separate-part binary STL export."},
  {folder:"20261021-2",name:"Pebble Vault",area:"stl",desc:"Customize a captive rolling-ball fidget with finger windows, grooved cage and adjustable running clearances. Live 3D preview, fit coupon and support-free assembly parts with local binary STL export."},
  {folder:"20261021-1",name:"Arch Pulse",area:"stl",desc:"Customize a hardware-free shallow-arch thumb press fidget with flared flexure roots, ergonomic grip and an integral travel stop. Live 3D preview, material sample and local binary STL export."},
  {folder:"20261020-23",name:"Slow Thread",area:"stl",desc:"Customize a hardware-free screw-winding fidget: turn a scalloped thumb nut along a sinusoidal threaded spindle. Live 3D preview, radial fit presets, calibration coupon and separate-part binary STL export."},
  {folder:"20261020-22",name:"Spiral Pause",area:"stl",desc:"Customize a one-piece planar torsion-spring fidget: gently twist the center against an ergonomic scalloped rim. Live 3D preview, web and turn controls, flex coupon and local binary STL export."},
  {folder:"20261020-21",name:"Thumb Harp",area:"stl",desc:"Customize a one-piece pluck-comb fidget with graduated cantilever tines, rounded roots and scalloped palm rail. Live 3D preview, flex test coupon and local binary STL export."},
  {folder:"20261020-20",name:"Shuttle Loop",area:"stl",desc:"Customize a captured linear thumb shuttle with a closed racetrack, scalloped pads and hardware-free press-fit cap. Live 3D preview, running-fit controls and local multi-part binary STL export."},
  {folder:"20261020-19",name:"Saddle Rock",area:"stl",desc:"Customize a hardware-free rocking thumb saddle with circular sole travel, concave crown and tactile ridges. Live 3D preview, ergonomic controls and local binary STL export."},
  {folder:"20261020-18",name:"Orbit Nest",area:"stl",desc:"Customize a print-in-place captive rotating-ring fidget with a V-profile race, scalloped grip and adjustable radial fit. Live 3D preview, fit coupon and local binary STL export."},
  {folder:"20261020-17",name:"Ripple Roll",area:"stl",desc:"Customize a hardware-free palm roller with an ergonomic waist and rhythmic longitudinal ribs. Live 3D preview, adjustable tactile relief and local binary STL export."},
  {folder:"20261020-16",name:"Palm Spring",area:"stl",desc:"Customize a compliant oval squeeze fidget with adjustable flexure walls, ergonomic dimensions and scalloped grip. Live 3D preview, flexibility coupon and local binary STL export."},
  {folder:"20261020-15",name:"Corner Keeper",area:"stl",desc:"Customize a right-angle assembly jig with independent arm lengths, rail width, height and bench-mount bores. Live 3D preview and local binary STL export."},
  {folder:"20261020-14",name:"Pourform",area:"stl",desc:"Design a hollow utility funnel with adjustable mouth, outlet bore, wall and bottle-fit clearance. Live 3D preview and local binary STL export."},
  {folder:"20261020-13",name:"Wedge Works",area:"stl",desc:"Customize a printable door wedge with adjustable dimensions and grip grooves. Interactive 3D preview and local binary STL export."},
  {folder:"20261020-12",name:"Moonlit Matinee",area:"game",desc:"Arrange woodland performers from before, adjacency, and spacing clues. Six untimed, uniquely solvable lineup puzzles with large tap controls, hints, optional sound, and saved best festival scores."},
  {folder:"20261020-11",name:"Last Ferry Florist",area:"game",desc:"Arrange bouquet wrapping jobs before their ferry deadlines. Sacrifice small tips to save bigger ones across six untimed departures, compare with exact optimal arrangements, and chase a saved best shift. Touch-first, optional sound, and offline play."},
  {folder:"20261020-10",name:"Odds Atelier",area:"game",desc:"Sculpt six die faces to beat the house with exact odds. Redistribute a pip budget across six untimed commissions, discover optimal designs, and chase a saved best edition. Touch-first, optional sound, and offline play."},
  {folder:"20261020-9",name:"Picnic Treaty",area:"game",desc:"Split eight treats into two baskets and let your guest choose first. Different tastes turn fair sharing into a six-picnic strategy puzzle. Untimed, touch-first, with exact optimal-split feedback, optional sound, and offline saved best scores."},
  {folder:"20261020-8",name:"Tea Leaf Society",area:"game",desc:"Test tea blends to uncover five secret tasting rules. Compare accepted and rejected samples, spend points on experiments, and make your deduction in a cozy, untimed, touch-first logic game. Optional sound, offline play, and saved best scores."},
  {folder:"20261020-7",name:"Prism Pact",area:"game",desc:"An untimed shared-trait strategy duel. Gift your rival a prism, then make four sharing color, shape, fill, or dot count. Three-round editions, large touch controls, optional sound, offline play, and saved best scores."},
  {folder:"20261020-6",name:"Dewdrop Duel",area:"game",desc:"A tiny botanical pawn-race duel. Grow mint sprouts to the far edge, capture diagonally, or block the rose gardener across five untimed rounds. Friendly or perfect-play AI, hints, undo, optional sound, offline play, and saved best scores."},

  {folder:"20261020-5",name:"Cocoa Gambit",area:"game",desc:"A five-round chocolate strategy duel. Preview corner bites, outfox a casual or perfect opponent, and leave the bitter piece behind. Touch-first, untimed, optional sound, and offline saved best scores."},
  {folder:"20261020-4",name:"Ribbon Bindery",area:"game",desc:"Flip ribbon bundles to reverse their order and turn their faces. Solve six untimed commissions at par in a cozy prefix-flip puzzle with big touch controls, undo, exact-path hints, optional sound, and offline saved best scores."},
  {folder:"20261020-3",name:"Orbit Atelier",area:"game",desc:"Draft twelve gemstones into a circular setting. Link matching neighbors and echo identical gems across the ring in a calm, touch-first jewelry puzzle. Optional sound, offline play, and saved best editions."},
  {folder:"20261020-2",name:"Stencil Studio",area:"game",desc:"Rotate two transparent ink layers to match eight colorful print commissions. An untimed registration puzzle with big touch controls, optional sound, offline play, and saved best editions."},
  {folder:"20261020-1",name:"Velvet Bids",area:"game",desc:"An untimed nine-card sealed-bid duel. Outfox the house, save strong cards for rich gem lots, and turn tied bids into rollover jackpots. Touch-first, optional sound, offline play, and saved records."}
];

const d=document;
const sections=d.getElementById('sections');
const search=d.getElementById('search');

const areaOrder=['stl','game','saas'];
const areaLabels={stl:'STL Generators',game:'Mini Games',saas:'SaaS Apps'};

d.getElementById('total-apps').textContent=APPS.length;
d.getElementById('total-saas').textContent=APPS.filter(a=>a.area==='saas').length;
d.getElementById('total-game').textContent=APPS.filter(a=>a.area==='game').length;

function makeCard(app) {
  const card=d.createElement('a');
  card.className='card';
  card.href=`${BASE_URL}${app.folder}/index.html`;
  card.target='_blank';
  card.rel='noopener';
  card.innerHTML=`
    <div class="badge">${app.area}</div>
    <div class="date">${app.folder}</div>
    <h2>${app.name}</h2>
    <div class="desc">${app.desc}</div>
    <div class="arrow">Open app →</div>
  `;
  return card;
}

function renderApps() {
  const q=(search.value||'').trim().toLowerCase();
  const filtered=APPS.filter(app => !q || [app.folder, app.name, app.desc, app.area].join(' ').toLowerCase().includes(q));
  sections.innerHTML='';
  if (!filtered.length) {
    sections.innerHTML='<div class="empty">No apps match your search.</div>';
    return;
  }

  const grouped=new Map();
  filtered.forEach(app=>{
    const key=areaOrder.includes(app.area) ? app.area : 'other';
    if(!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(app);
  });

  const orderedKeys=[...areaOrder.filter(k=>grouped.has(k)), ...[...grouped.keys()].filter(k=>!areaOrder.includes(k))];
  orderedKeys.forEach(key=>{
    const list=grouped.get(key);
    const section=d.createElement('section');
    section.className='section';

    const head=d.createElement('div');
    head.className='section-head';
    head.innerHTML=`<div class="section-title">${areaLabels[key] || key.charAt(0).toUpperCase()+key.slice(1)}</div><div class="section-meta">${list.length} item${list.length===1?'':'s'}</div>`;

    const grid=d.createElement('div');
    grid.className='grid';
    list.forEach(app=>grid.appendChild(makeCard(app)));

    section.appendChild(head);
    section.appendChild(grid);
    sections.appendChild(section);
  });
}

search.addEventListener('input', renderApps);
renderApps();
</script>
</body>
</html>
